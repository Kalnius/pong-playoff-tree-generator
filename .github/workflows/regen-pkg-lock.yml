name: Regenerate package-lock

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-lock:
    name: Regenerate package-lock
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Force public npm registry
        run: |
          npm config set registry https://registry.npmjs.org/
          npm config get registry

      - name: Remove old lock file
        run: |
          rm -f package-lock.json
          rm -rf node_modules

      - name: Generate new package-lock.json
        run: npm install --package-lock-only --include=dev

      - name: Commit package-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate package-lock with public npm registry" || echo "No changes to commit"
          git push
